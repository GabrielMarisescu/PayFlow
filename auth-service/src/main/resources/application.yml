spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_auth
    username: payflow
    password: payflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

jwt:
  secret: payflow-auth-secret-key-change-in-production
  access-token-expiration: 15
  refresh-token-expiration: 7

auth:
  max-login-attempts: 5
  lockout-duration: 15

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.payflow.auth: DEBUG
    org.springframework.security: INFO
